apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-os
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sovereign-data
  namespace: sovereign-os
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: sovereign-os
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-config
  namespace: sovereign-os
data:
  config.json: |
    {
      "llmProviders": ["ollama", "together", "groq"],
      "dataStorage": "local",
      "encryption": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: sovereign-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: sovereign-os
spec:
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-os
  namespace: sovereign-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sovereign-os
  template:
    metadata:
      labels:
        app: sovereign-os
    spec:
      containers:
      - name: sovereign-os
        image: sovereign-os:2.1.0
        ports:
        - containerPort: 8000
        env:
        - name: OLLAMA_HOST
          value: "http://ollama:11434"
        volumeMounts:
        - name: sovereign-data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: sovereign-data
        persistentVolumeClaim:
          claimName: sovereign-data
      - name: config
        configMap:
          name: sovereign-config
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-os
  namespace: sovereign-os
spec:
  selector:
    app: sovereign-os
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovereign-os
  namespace: sovereign-os
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - sovereign-os.example.com
    secretName: sovereign-os-tls
  rules:
  - host: sovereign-os.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sovereign-os
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sovereign-os
  namespace: sovereign-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sovereign-os
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
